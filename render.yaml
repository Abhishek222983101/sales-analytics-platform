# Render blueprint — one-click deploy of the Streamlit app as a web service.
# In the Render dashboard: New → Blueprint → pick this repo. Set LLM_API_KEY there.
# Note: the free plan is 512 MB RAM (tight for this ML stack); if it OOMs, use
# Streamlit Community Cloud (1 GB) instead — see README.
services:
  - type: web
    name: lumi-sales-analytics
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: >
      streamlit run app.py
      --server.port $PORT
      --server.address 0.0.0.0
      --server.headless true
      --server.enableCORS false
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_API_KEY
        sync: false        # set this secret in the Render dashboard, never in git
